services:
  # 统一的 CPU 跨平台核心服务
  evm-cpu:
    image: evm-app:latest
    container_name: evm-cpu-runner
    # 将宿主机的 data 目录映射到容器内的 /app/data
    volumes:
      - ./data:/app/data
    environment:
      # ===== 运行参数 =====
      - EVM_THREADS=4 # CPU 线程数 (树莓派建议 1)
      - EVM_ACCEL=cpu # 加速模式: cpu / cuda
      # ===== 算法参数 (不设置则使用 evm.py 默认值) =====
      # - EVM_MODE=gaussian     # 金字塔模式: gaussian(颜色放大) / laplacian(运动放大)
      # - EVM_LEVEL=4           # 金字塔层数
      # - EVM_ALPHA=100         # 放大系数
      # - EVM_LAMBDA_CUTOFF=1000 # λ 截止值 (仅 laplacian 模式)
      # - EVM_LOW_OMEGA=0.833   # 最低频率
      # - EVM_HIGH_OMEGA=1      # 最高频率
      # - EVM_ATTENUATION=1     # I/Q 通道衰减系数
      # 自动尝试重启，使得容器变为常驻后台服务
    restart: unless-stopped
